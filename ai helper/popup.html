<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      width: 320px;
      height: 420px;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
    }

    h3 {
      margin: 0;
      padding: 12px;
      background: #1e293b;
      text-align: center;
      font-size: 16px;
      border-bottom: 1px solid #334155;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      max-width: 85%;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .user {
      align-self: flex-end;
      background: #3b82f6;
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bot {
      align-self: flex-start;
      background: #1e293b;
      border: 1px solid #334155;
      border-bottom-left-radius: 2px;
    }

    #inputArea {
      display: flex;
      border-top: 1px solid #334155;
      padding: 8px;
      gap: 6px;
      background: #020617;
    }

    #input {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: #1e293b;
      color: white;
    }

    #send {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    #send:hover {
      background: #2563eb;
    }

    #chat::-webkit-scrollbar {
      width: 6px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <h3>🤖 AI Помощник</h3>

  <div id="chat"></div>

  <div id="inputArea">
    <input id="input" placeholder="Задай вопрос..." />
    <button id="send">→</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
